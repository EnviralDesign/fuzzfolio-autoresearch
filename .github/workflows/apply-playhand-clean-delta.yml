name: Apply reviewed PlayHand drain delta

"on":
  push:
    branches: [agent/playhand-drain-final-clean]
    paths:
      - "tools/apply_playhand_clean_delta.py"
      - ".github/workflows/apply-playhand-clean-delta.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playhand-drain-final-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply final reviewed delta
        run: python tools/apply_playhand_clean_delta.py
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Compile package and tests
        run: python -m compileall -q autoresearch tests
      - name: Run PlayHand resilience regressions
        run: >-
          python -m pytest -q
          tests/test_durable_execution.py
          tests/test_lake_window_client.py
          tests/test_play_hand_lab_duplicate_results.py
          tests/test_play_hand_lab_enqueue.py
          tests/test_play_hand_lab_entrypoint.py
          tests/test_package_enqueue_bootstrap.py
          tests/test_play_hand_lab_memory.py
          tests/test_play_hand_lab_deep_memory.py
          tests/test_play_hand_lab_sweep_spec_memory.py
          tests/test_play_hand_lab_startup.py
          tests/test_play_hand_lab_streaming_journal_memory.py
          tests/test_play_hand_lab_memory_diagnostics.py
          tests/test_play_hand_lab_memory_installation.py
          tests/test_play_hand_lab_barrier_memory_line.py
          tests/test_play_hand_lab_gateway_runtime.py
          tests/test_play_hand_lab_throughput.py
          tests/test_play_hand_lab_result_fastpath.py
          tests/test_play_hand_lab_result_drain_final.py
      - name: Run touched core behavior checks
        run: >-
          python -m pytest -q
          tests/test_play_hand_lab.py::test_compact_terminal_lane_state_drops_heavy_payloads
          tests/test_play_hand_lab.py::test_lane_state_payload_matches_legacy_projection_without_deep_copy
          tests/test_play_hand_lab.py::test_recover_unresolved_journal_task_graph_restores_checkpoint_gap
          tests/test_play_hand_lab.py::test_detach_attach_task_profile_snapshots_round_trip
      - name: Commit reviewed production changes
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add autoresearch tests .github/workflows/playhand-enqueue-tests.yml
          git commit -m "Finish PlayHand result drain memory and throughput bounds"
          git push origin HEAD:agent/playhand-drain-final-clean
