name: Result fast-path debug tests

"on":
  pull_request:
    paths:
      - "autoresearch/play_hand_lab_result_fastpath.py"
      - "tests/test_play_hand_lab_result_fastpath.py"
      - ".github/workflows/fastpath-debug.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_phase3_runtime_preserves_the_configured_drain_transaction_size
          - test_worker_result_identity_is_hashed_once_per_delivered_object
          - test_canonical_worker_score_avoids_the_compare_sensitivity_subprocess
          - test_deep_replay_job_artifact_keeps_summary_not_the_duplicate_full_result
          - test_fresh_receipt_handoff_is_one_shot_and_not_rehashed_immediately
          - test_receipt_with_derived_task_graph_is_never_retained_in_cache
          - test_sweep_receipt_is_compact_on_the_first_write
          - test_barrier_exposes_actual_result_processing_cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q "tests/test_play_hand_lab_result_fastpath.py::${{ matrix.test }}"
