name: Temporal search discovery controller

on:
  push:
    branches: [master]
    paths:
      - "autoresearch/temporal_discovery*.py"
      - "autoresearch/temporal_search_quality*.py"
      - "autoresearch/temporal_search_activation*.py"
      - "autoresearch/temporal_search_policy_v2*.py"
      - "autoresearch/temporal_search_selector_v2*.py"
      - "autoresearch/temporal_search_generator_v2*.py"
      - "autoresearch/temporal_search_stage5e2*.py"
      - "autoresearch/temporal_search_stage5e3*.py"
      - "autoresearch/temporal_search_stage5e4*.py"
      - "autoresearch/temporal_structural_operators.py"
      - "autoresearch/temporal_operator_*.py"
      - "autoresearch/temporal_confirmed_entry_*.py"
      - "scripts/temporal_policy_v2_native_witness.py"
      - "scripts/temporal_confirmed_entry_native_witness.py"
      - "scripts/temporal_stage5e3_native_validation.py"
      - "tests/test_temporal_discovery.py"
      - "tests/test_temporal_discovery_prepare.py"
      - "tests/test_temporal_search_quality.py"
      - "tests/test_temporal_search_activation.py"
      - "tests/test_temporal_search_policy_v2.py"
      - "tests/test_temporal_search_selector_v2.py"
      - "tests/test_temporal_search.py"
      - "tests/test_temporal_search_preflight.py"
      - "tests/test_temporal_search_stage5e3.py"
      - "tests/test_temporal_search_stage5e3_midpoint.py"
      - "tests/test_temporal_search_stage5e4_diagnostics.py"
      - "tests/test_temporal_structural_operators.py"
      - "pyproject.toml"
      - ".github/workflows/temporal-search-discovery.yml"
  pull_request:
    paths:
      - "autoresearch/temporal_discovery*.py"
      - "autoresearch/temporal_search_quality*.py"
      - "autoresearch/temporal_search_activation*.py"
      - "autoresearch/temporal_search_policy_v2*.py"
      - "autoresearch/temporal_search_selector_v2*.py"
      - "autoresearch/temporal_search_generator_v2*.py"
      - "autoresearch/temporal_search_stage5e2*.py"
      - "autoresearch/temporal_search_stage5e3*.py"
      - "autoresearch/temporal_search_stage5e4*.py"
      - "autoresearch/temporal_structural_operators.py"
      - "autoresearch/temporal_operator_*.py"
      - "autoresearch/temporal_confirmed_entry_*.py"
      - "scripts/temporal_policy_v2_native_witness.py"
      - "scripts/temporal_confirmed_entry_native_witness.py"
      - "scripts/temporal_stage5e3_native_validation.py"
      - "tests/test_temporal_discovery.py"
      - "tests/test_temporal_discovery_prepare.py"
      - "tests/test_temporal_search_quality.py"
      - "tests/test_temporal_search_activation.py"
      - "tests/test_temporal_search_policy_v2.py"
      - "tests/test_temporal_search_selector_v2.py"
      - "tests/test_temporal_search.py"
      - "tests/test_temporal_search_preflight.py"
      - "tests/test_temporal_search_stage5e3.py"
      - "tests/test_temporal_search_stage5e3_midpoint.py"
      - "tests/test_temporal_search_stage5e4_diagnostics.py"
      - "tests/test_temporal_structural_operators.py"
      - "pyproject.toml"
      - ".github/workflows/temporal-search-discovery.yml"

jobs:
  discovery-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync frozen environment
        run: uv sync --frozen
      - name: Compile discovery controller
        run: |
          uv run python -m py_compile \
            autoresearch/temporal_discovery*.py \
            autoresearch/temporal_search_quality*.py \
            autoresearch/temporal_search_activation*.py \
            autoresearch/temporal_search_policy_v2*.py \
            autoresearch/temporal_search_selector_v2*.py \
            autoresearch/temporal_search_generator_v2*.py \
            autoresearch/temporal_search_stage5e2*.py \
            autoresearch/temporal_search_stage5e3*.py \
            autoresearch/temporal_search_stage5e4*.py \
            autoresearch/temporal_structural_operators.py \
            autoresearch/temporal_operator_*.py \
            autoresearch/temporal_confirmed_entry_*.py \
            scripts/temporal_policy_v2_native_witness.py \
            scripts/temporal_confirmed_entry_native_witness.py \
            scripts/temporal_stage5e3_native_validation.py \
            tests/test_temporal_discovery.py \
            tests/test_temporal_discovery_prepare.py \
            tests/test_temporal_search_quality.py \
            tests/test_temporal_search_activation.py \
            tests/test_temporal_search_policy_v2.py \
            tests/test_temporal_search_selector_v2.py \
            tests/test_temporal_search_stage5e3.py \
            tests/test_temporal_search_stage5e3_midpoint.py \
            tests/test_temporal_search_stage5e4_diagnostics.py \
            tests/test_temporal_structural_operators.py
      - name: Run deterministic discovery regressions
        run: >-
          uv run --with pytest python -m pytest -q
          tests/test_temporal_discovery.py
          tests/test_temporal_discovery_prepare.py
          tests/test_temporal_search.py
          tests/test_temporal_search_preflight.py
          tests/test_temporal_search_quality.py
          tests/test_temporal_search_activation.py
          tests/test_temporal_search_policy_v2.py
          tests/test_temporal_search_selector_v2.py
          tests/test_temporal_search_stage5e3.py
          tests/test_temporal_search_stage5e3_midpoint.py
          tests/test_temporal_search_stage5e4_diagnostics.py
          tests/test_temporal_structural_operators.py
