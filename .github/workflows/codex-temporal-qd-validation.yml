name: Codex Temporal QD validation

on:
  push:
    branches:
      - codex/temporal-qd-simplification
    paths:
      - "rust/temporal-qd/**"
      - "rust-toolchain.toml"
      - "autoresearch/temporal_qd_native.py"
      - "autoresearch/temporal_qd_evolution.py"
      - "autoresearch/temporal_qd_pair_generation.py"
      - "autoresearch/temporal_qd_pair_factory.py"
      - "autoresearch/temporal_qd_supervisor.py"
      - "autoresearch/temporal_qd_v5_control_plane.py"
      - "autoresearch/temporal_qd_v5_native.py"
      - "tests/test_temporal_qd_*.py"
      - ".github/workflows/codex-temporal-qd-validation.yml"

permissions:
  contents: read

concurrency:
  group: codex-temporal-qd-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/temporal-qd-simplification

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync frozen Python environment
        run: uv sync --frozen

      - name: Expose frozen Python environment to Rust oracle tests
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Read pinned Rust channel
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Check Rust formatting
        working-directory: rust/temporal-qd
        run: cargo fmt --check

      - name: Run affected Rust tests
        working-directory: rust/temporal-qd
        run: >-
          cargo test
          -p temporal-qd-rotating-prefinalizer
          -p temporal-qd-kernel
          -p temporal-qd-batch

      - name: Lint affected Rust crates
        working-directory: rust/temporal-qd
        run: >-
          cargo clippy
          -p temporal-qd-rotating-prefinalizer
          -p temporal-qd-kernel
          -p temporal-qd-batch
          --all-targets

      - name: Run focused Python Temporal QD tests
        run: >-
          uv run pytest -q
          tests/test_temporal_qd_v5_native_bridge.py
          tests/test_temporal_qd_v5_control_plane.py
          tests/test_temporal_qd_v5_supervisor_fixture.py
