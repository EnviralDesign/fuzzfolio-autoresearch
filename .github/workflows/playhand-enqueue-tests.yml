name: PlayHand resilience regression tests

"on":
  pull_request:
    paths:
      - "autoresearch/__init__.py"
      - "autoresearch/play_hand_lab.py"
      - "autoresearch/play_hand_lab_enqueue.py"
      - "autoresearch/play_hand_lab_entrypoint.py"
      - "autoresearch/play_hand_lab_gateway_runtime.py"
      - "autoresearch/play_hand_lab_memory.py"
      - "autoresearch/play_hand_lab_memory_deep.py"
      - "autoresearch/play_hand_lab_startup.py"
      - "autoresearch/play_hand_lab_throughput.py"
      - "autoresearch/play_hand_lab_duplicate_results.py"
      - "autoresearch/durable_execution.py"
      - "autoresearch/lake_window_client.py"
      - "tests/test_durable_execution.py"
      - "tests/test_lake_window_client.py"
      - "tests/test_play_hand_lab_barrier_memory_line.py"
      - "tests/test_play_hand_lab_deep_memory.py"
      - "tests/test_play_hand_lab_gateway_runtime.py"
      - "tests/test_play_hand_lab_memory_diagnostics.py"
      - "tests/test_play_hand_lab_memory_installation.py"
      - "tests/test_play_hand_lab_startup.py"
      - "tests/test_play_hand_lab_streaming_journal_memory.py"
      - "tests/test_play_hand_lab_sweep_spec_memory.py"
      - "tests/test_play_hand_lab_throughput.py"
      - "tests/test_play_hand_lab_duplicate_results.py"
      - "tests/test_play_hand_lab_enqueue.py"
      - "tests/test_play_hand_lab_entrypoint.py"
      - "tests/test_play_hand_lab_memory.py"
      - "tests/test_package_enqueue_bootstrap.py"
      - "pyproject.toml"
      - ".github/workflows/playhand-enqueue-tests.yml"
  push:
    branches: [master]
    paths:
      - "autoresearch/__init__.py"
      - "autoresearch/play_hand_lab.py"
      - "autoresearch/play_hand_lab_enqueue.py"
      - "autoresearch/play_hand_lab_entrypoint.py"
      - "autoresearch/play_hand_lab_gateway_runtime.py"
      - "autoresearch/play_hand_lab_memory.py"
      - "autoresearch/play_hand_lab_memory_deep.py"
      - "autoresearch/play_hand_lab_startup.py"
      - "autoresearch/play_hand_lab_throughput.py"
      - "autoresearch/play_hand_lab_duplicate_results.py"
      - "autoresearch/durable_execution.py"
      - "autoresearch/lake_window_client.py"
      - "tests/test_durable_execution.py"
      - "tests/test_lake_window_client.py"
      - "tests/test_play_hand_lab_barrier_memory_line.py"
      - "tests/test_play_hand_lab_deep_memory.py"
      - "tests/test_play_hand_lab_gateway_runtime.py"
      - "tests/test_play_hand_lab_memory_diagnostics.py"
      - "tests/test_play_hand_lab_memory_installation.py"
      - "tests/test_play_hand_lab_startup.py"
      - "tests/test_play_hand_lab_streaming_journal_memory.py"
      - "tests/test_play_hand_lab_sweep_spec_memory.py"
      - "tests/test_play_hand_lab_throughput.py"
      - "tests/test_play_hand_lab_duplicate_results.py"
      - "tests/test_play_hand_lab_enqueue.py"
      - "tests/test_play_hand_lab_entrypoint.py"
      - "tests/test_play_hand_lab_memory.py"
      - "tests/test_package_enqueue_bootstrap.py"
      - "pyproject.toml"
      - ".github/workflows/playhand-enqueue-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Run durable journal regressions
        run: python -m pytest -q tests/test_durable_execution.py
      - name: Run lake retry regressions
        run: python -m pytest -q tests/test_lake_window_client.py
      - name: Run duplicate-result regressions
        run: python -m pytest -q tests/test_play_hand_lab_duplicate_results.py
      - name: Run enqueue and bootstrap regressions
        run: >-
          python -m pytest -q
          tests/test_play_hand_lab_enqueue.py
          tests/test_play_hand_lab_entrypoint.py
          tests/test_package_enqueue_bootstrap.py
      - name: Run base memory regressions
        run: python -m pytest -q tests/test_play_hand_lab_memory.py
      - name: Run deep memory, sweep, and startup regressions
        run: >-
          python -m pytest -q
          tests/test_play_hand_lab_deep_memory.py
          tests/test_play_hand_lab_sweep_spec_memory.py
          tests/test_play_hand_lab_startup.py
      - name: Run streaming journal peak regression
        run: python -m pytest -q tests/test_play_hand_lab_streaming_journal_memory.py
      - name: Run memory installation and telemetry regressions
        run: >-
          python -m pytest -q
          tests/test_play_hand_lab_memory_diagnostics.py
          tests/test_play_hand_lab_memory_installation.py
          tests/test_play_hand_lab_barrier_memory_line.py
      - name: Run result backlog throughput regressions
        run: >-
          python -m pytest -q
          tests/test_play_hand_lab_gateway_runtime.py
          tests/test_play_hand_lab_throughput.py
