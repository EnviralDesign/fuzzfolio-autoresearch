name: Codex Temporal QD apply patch

on:
  push:
    branches:
      - codex/temporal-qd-simplification
    paths:
      - .codex/apply.patch
      - .codex/commit-message.txt

permissions:
  contents: write

concurrency:
  group: codex-temporal-qd-apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/temporal-qd-simplification
          fetch-depth: 0

      - name: Apply tested patch and commit
        shell: bash
        run: |
          if [[ ! -f .codex/apply.patch ]]; then
            echo "No staged patch remains; nothing to apply."
            exit 0
          fi
          if [[ ! -f .codex/commit-message.txt ]]; then
            echo "Missing .codex/commit-message.txt" >&2
            exit 2
          fi
          commit_message="$(cat .codex/commit-message.txt)"
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git apply --index --whitespace=nowarn .codex/apply.patch
          git rm -f .codex/apply.patch .codex/commit-message.txt
          git commit -m "$commit_message"
          git push origin HEAD:codex/temporal-qd-simplification
