name: Codex Temporal QD apply patch

on:
  push:
    branches:
      - codex/temporal-qd-simplification
    paths:
      - .codex/commit-message.txt

permissions:
  contents: write

concurrency:
  group: codex-temporal-qd-apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/temporal-qd-simplification
          fetch-depth: 0

      - name: Apply tested patch and commit
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.codex/apply.patch.gz.b64.part-*)
          if [[ ! -f .codex/apply.patch && ! -f .codex/apply.patch.gz && ${#parts[@]} -eq 0 ]]; then
            echo "No staged patch remains; nothing to apply."
            exit 0
          fi
          if [[ ! -f .codex/commit-message.txt ]]; then
            echo "Missing .codex/commit-message.txt" >&2
            exit 2
          fi
          commit_message="$(cat .codex/commit-message.txt)"
          patch_path=.codex/apply.patch
          if (( ${#parts[@]} > 0 )); then
            cat "${parts[@]}" | base64 --decode | gzip -dc > "$RUNNER_TEMP/apply.patch"
            patch_path="$RUNNER_TEMP/apply.patch"
          elif [[ -f .codex/apply.patch.gz ]]; then
            gzip -dc .codex/apply.patch.gz > "$RUNNER_TEMP/apply.patch"
            patch_path="$RUNNER_TEMP/apply.patch"
          fi
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git apply --index --whitespace=nowarn "$patch_path"
          git rm -f --ignore-unmatch \
            .codex/apply.patch \
            .codex/apply.patch.gz \
            .codex/apply.patch.gz.b64.part-* \
            .codex/commit-message.txt
          git commit -m "$commit_message"
          git push origin HEAD:codex/temporal-qd-simplification
