[package]
name = "temporal-qd-gateway-dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "temporal-qd-gateway-dispatch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
temporal-qd-campaign-seal = { path = "../qd-campaign-seal" }
temporal-qd-contract = { path = "../qd-contract" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
