[workspace]
members = [
    "crates/qd-contract",
    "crates/qd-kernel",
    "crates/qd-dashboard-jsonl",
    "crates/qd-runtime",
    "crates/qd-batch",
    "crates/qd-tail-reducer",
    "crates/qd-archive-reducer",
    "crates/qd-campaign-seal",
    "crates/qd-generation-finalizer",
    "crates/qd-rotating-prefinalizer",
    "crates/qd-campaign-freeze",
    "crates/qd-gateway-dispatch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
# The Python oracle uses zlib's deflate implementation. The system-zlib
# backend preserves byte-exact deterministic gzip projections; miniz_oxide is
# semantically equivalent but chooses different deflate blocks.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
ryu = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
